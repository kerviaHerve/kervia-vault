name: CI

on: [push, pull_request]

jobs:
  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: Build webui (feeds internal/web/dist for go:embed)
        working-directory: web-app
        run: |
          npm ci
          npx tsc --noEmit
          npx vite build
      - name: Build Firefox extension XPI (embeds in dist for go:embed)
        run: |
          cd extension-firefox
          zip -r -X ../internal/web/dist/extension-firefox.xpi . -x "*.DS_Store"
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: internal/web/dist/
          retention-days: 3

  test:
    runs-on: ubuntu-latest
    needs: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/web/dist/
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    needs: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/web/dist/
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8

  security:
    runs-on: ubuntu-latest
    needs: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/web/dist/
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      # gosec standalone retiré : gosec@latest ne sait plus lire l'export data
      # de Go 1.27 (SSA "export data version 5"). L'analyse gosec reste couverte
      # par le job lint (golangci-lint embarque un gosec compatible 1.27).
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck install.sh scripts/*.sh