name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # webui first — go:embed needs internal/web/dist to exist
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: Build webui
        working-directory: web-app
        run: |
          npm ci
          npx vite build
      # extension Firefox : XPI embarqué dans le binaire (carte webui
      # Paramètres → Extension) + joint à la release.
      - name: Build Firefox extension XPI (unsigned)
        run: |
          cd extension-firefox
          zip -r -X ../internal/web/dist/extension-firefox.xpi . -x "*.DS_Store"

      # Signature AMO (unlisted) : XPI installable en permanence (fini
      # about:debugging) + mises à jour auto via update_url. Nécessite les
      # secrets repo AMO_API_KEY (JWT issuer) / AMO_API_SECRET (JWT secret).
      # Absents ou file AMO bloquée : fallback silencieux sur le XPI non
      # signé (chargement temporaire) — la release n'échoue jamais pour ça.
      - name: Sign Firefox extension XPI via AMO (unlisted)
        id: amo
        continue-on-error: true
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          if [ -z "$AMO_API_KEY" ] || [ -z "$AMO_API_SECRET" ]; then
            echo "secrets AMO_API_KEY/AMO_API_SECRET absents — XPI non signé (fallback embarqué)"
            exit 1
          fi
          npx --yes web-ext@8 sign \
            --source-dir extension-firefox \
            --artifacts-dir amo-signed \
            --channel unlisted \
            --id coffre@kervia-vault \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET" \
            --timeout-wait 1200

      # XPI final (signé si dispo) + manifest de mise à jour servi par la
      # webui (/ui/extension-updates.json) : une seule entrée, la version
      # courante — Firefox compare et propose la mise à jour aux installs.
      - name: Finalize XPI + update manifest
        run: |
          shopt -s nullglob
          files=(amo-signed/*.xpi)
          if [ ${#files[@]} -gt 0 ]; then
            cp "${files[0]}" internal/web/dist/extension-firefox.xpi
            echo "AMO_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "AMO_SIGNED=false" >> "$GITHUB_ENV"
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          printf '{\n  "addons": {\n    "coffre@kervia-vault": {\n      "updates": [\n        {\n          "version": "%s",\n          "update_link": "https://vault.kervia.ch/ui/extension-firefox.xpi"\n        }\n      ]\n    }\n  }\n}\n' "$VERSION" > internal/web/dist/extension-updates.json
          cp internal/web/dist/extension-firefox.xpi extension-firefox.xpi
          unzip -l extension-firefox.xpi | tail -3
          echo "--- extension-updates.json ---"
          cat internal/web/dist/extension-updates.json

      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }

      - name: Build static binaries (linux/darwin × amd64/arm64)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for TARGET in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            OS="${TARGET%/*}"; ARCH="${TARGET#*/}"
            CGO_ENABLED=0 GOOS="$OS" GOARCH="$ARCH" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o build/kervia-vault ./cmd/kervia-vault
            tar -czf "kervia-vault-${OS}-${ARCH}.tar.gz" -C build kervia-vault
            rm -f build/kervia-vault
          done
          sha256sum kervia-vault-*.tar.gz extension-firefox.xpi > kervia-vault_checksums.txt
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      # Release notes: extract this tag's section from CHANGELOG.md
      # (between "## <tag>" and the next "## " line) + install reminder.
      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 - <<'EOF'
          import re, os, sys
          tag = os.environ["GITHUB_REF_NAME"]
          src = open("CHANGELOG.md").read()
          m = re.search(r"## " + re.escape(tag) + r"\s*\((.*?)\)\s*\n(.*?)(?=\n## |\n---)", src, re.S)
          if not m:
              sys.exit("CHANGELOG.md has no '## " + tag + "' section")
          date, body = m.groups()
          notes = "Kervia-vault " + tag + " — " + date + "\n\n" + body.strip() + "\n\n---\n\n## Install\n\n```bash\nsudo bash install.sh\n```\n\nThe installer verifies the sha256 checksum before installing.\nUpdates: webui → Settings → Version → *Update now* (self-update, data untouched).\n\nFull history: CHANGELOG.md"
          open("RELEASE_NOTES.md", "w").write(notes)
          print("RELEASE_NOTES.md:", len(notes), "chars")
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Kervia-vault v${{ env.RELEASE_VERSION }}"
          files: |
            kervia-vault-linux-amd64.tar.gz
            kervia-vault-linux-arm64.tar.gz
            kervia-vault-darwin-amd64.tar.gz
            kervia-vault-darwin-arm64.tar.gz
            extension-firefox.xpi
            kervia-vault_checksums.txt
          body_path: RELEASE_NOTES.md
      - name: Verify release assets are downloadable
        run: |
          sleep 5
          ARCH=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
          curl -sfL "https://github.com/kerviaHerve/kervia-vault/releases/latest/download/kervia-vault_checksums.txt" -o /tmp/sums.txt
          grep "kervia-vault-linux-${ARCH}.tar.gz" /tmp/sums.txt