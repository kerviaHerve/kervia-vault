<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Coffre</title>
  <link rel="stylesheet" href="css/popup.css" />
</head>
<body>
  <header>
    <div class="brand-tile"><span data-lucide="shield-check" data-size="17"></span></div>
    <div class="brand">
      <strong data-i18n="appTitle">Coffre</strong>
      <span class="sub" id="server-label">Kervia-vault</span>
    </div>
    <span class="grow"></span>
    <button id="btn-sync" class="icon-btn" data-i18n-title="resync" title="Resynchroniser depuis le coffre" aria-label="Resynchroniser depuis le coffre"><span data-lucide="refresh-cw"></span></button>
    <button id="btn-lock" class="icon-btn" data-i18n-title="lock" title="Verrouiller" aria-label="Verrouiller" hidden><span data-lucide="lock"></span></button>
    <button id="btn-options" class="icon-btn" data-i18n-title="settings" title="Réglages" aria-label="Réglages"><span data-lucide="settings"></span></button>
  </header>

  <!-- écran verrouillé -->
  <section id="locked" class="locked-screen">
    <div class="lock-tile"><span data-lucide="lock" data-size="21"></span></div>
    <h2 class="locked-title" data-i18n="lockedTitle">Coffre verrouillé</h2>
    <p class="hint" data-i18n="lockedHint">Déverrouillez le coffre avec votre mot de passe maître.</p>
    <div class="pw-wrap">
      <input type="password" id="master" data-i18n-ph="masterPw" placeholder="Mot de passe maître"
             autocomplete="off" autofocus aria-describedby="caps-hint unlock-err" />
      <button id="btn-eye" class="icon-btn pw-eye" data-i18n-title="showHide" title="Afficher / masquer" aria-label="Afficher / masquer" aria-pressed="false"><span data-lucide="eye" data-size="14"></span></button>
    </div>
    <p class="caps" id="caps-hint" data-i18n="capsOn" hidden>Majuscules activées</p>
    <button id="btn-unlock" class="primary"><span data-lucide="lock-open" data-size="15"></span><span data-i18n="unlockBtn">Déverrouiller</span></button>
    <p class="err" id="unlock-err" role="alert" hidden></p>
    <p class="hint small" id="session-hint" data-i18n="noTokenHint" hidden>
      Token manquant — créez-le dans la webui (Paramètres → Extension), puis collez-le dans les réglages de l’extension.
    </p>
    <button id="btn-open-options" class="cta" data-i18n="openSettings" hidden>Ouvrir les réglages</button>
  </section>

  <!-- écran déverrouillé -->
  <section id="main" hidden>
    <div class="searchbar row">
      <div class="search-wrap">
        <span data-lucide="search" data-size="14" class="lead-icon"></span>
        <input type="search" id="search" data-i18n-ph="searchPh" data-i18n-aria="searchPh" placeholder="Rechercher…" aria-label="Rechercher…" />
      </div>
      <span class="kbd" data-i18n-title="kbdHint" title="Appuyez sur / pour rechercher" aria-hidden="true">/</span>
      <button id="btn-generator" class="icon-btn" data-i18n-title="genTitle" title="Générateur de mots de passe" aria-label="Générateur de mots de passe"><span data-lucide="dices"></span></button>
    </div>

    <div id="page-section" hidden>
      <div class="section-title" id="page-title">Cette page</div>
      <div id="matches" class="items" role="list"></div>
    </div>

    <div class="section-title" id="all-title">
      <span data-i18n="allItems">Tous les éléments</span>
    </div>
    <div id="all-items" class="items scroll" role="list"></div>

    <div id="generator" hidden class="card">
      <div class="row">
        <output id="gen-out" class="mono"></output>
        <button id="gen-copy" class="icon-btn" data-i18n-title="genCopy" title="Copier" aria-label="Copier"><span data-lucide="copy" data-size="14"></span></button>
      </div>
      <div class="row small gen-row">
        <span class="gen-label" data-i18n="genLen">Longueur</span>
        <input type="range" id="gen-len" min="8" max="64" value="20" data-i18n-aria="genLen" aria-label="Longueur" />
        <span id="gen-len-val" class="mono">20</span>
      </div>
      <div class="row small gen-opts">
        <label><input type="checkbox" id="gen-upper" checked />A-Z</label>
        <label><input type="checkbox" id="gen-digits" checked />0-9</label>
        <label><input type="checkbox" id="gen-symbols" checked />!@#</label>
        <button id="gen-regen" class="icon-btn" data-i18n-title="genRegen" title="Régénérer" aria-label="Régénérer"><span data-lucide="refresh-cw" data-size="14"></span></button>
      </div>
    </div>
  </section>

  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script src="js/lucide.js"></script>
  <script src="js/coffre-lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
